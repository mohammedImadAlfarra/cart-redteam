name: CART security scan

# Runs the automated red-team scan on every push and pull request.
# The scan only targets the intentionally-vulnerable lab apps that this repo
# starts itself on localhost, so it is safe to run in CI.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run CART scan
        run: python run.py --scan-only --quiet

      - name: Upload HTML + JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cart-report
          path: |
            reports/report.html
            reports/report.json
            reports/graphs/
